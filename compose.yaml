services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: storeorders-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${STOREORDERS_SQL_PASSWORD:?Define STOREORDERS_SQL_PASSWORD in .env}"
    ports:
      - "${STOREORDERS_SQL_PORT:-14330}:1433"
    volumes:
      - storeorders-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1"
          > /dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

volumes:
  storeorders-sql-data:
    name: storeorders-sql-data
